<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <meta name="application-name" content="LUNO" />
    <meta name="apple-mobile-web-app-title" content="LUNO" />
    <title>LUNO</title>
    <meta name="description" content="LUNO es tu sistema personal: tareas, proyectos, hábitos, notas, calendario, finanzas y personas, conectados en un solo lugar." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LUNO" />
    <meta property="og:title" content="LUNO — Tu sistema personal" />
    <meta property="og:description" content="Tareas, proyectos, hábitos, notas, calendario, finanzas y personas, conectados en un solo lugar." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LUNO — Tu sistema personal." />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LUNO — Tu sistema personal" />
    <meta name="twitter:description" content="Tareas, proyectos, hábitos, notas, calendario, finanzas y personas, conectados en un solo lugar." />
    <meta name="twitter:image" content="/og.png" />
    <script>
      try {
        var t = localStorage.getItem('ntab-theme') || 'dark';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
        var a = localStorage.getItem('ntab-accent');
        if (a && a !== 'blue') document.documentElement.dataset.accent = a;
        if (localStorage.getItem('ntab-contrast') === 'on' || matchMedia('(prefers-contrast: more)').matches) document.documentElement.dataset.contrast = 'more';
        if (localStorage.getItem('ntab-motion') === 'on' || matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.dataset.motion = 'reduce';
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
      // En el iPhone y el iPad, tocar un campo de texto de menos de 16 px acerca la
      // página (y hay que alejarla a mano): así no lo hace. Pellizcar para ampliar
      // sigue funcionando (Safari no deja quitarlo desde iOS 10).
      if (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        var vp = document.querySelector('meta[name=viewport]');
        if (vp) vp.content += ', maximum-scale=1';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
